<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小具</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; display: flex; height: 100vh; overflow: hidden; }

/* ===== 左侧聊天区 ===== */
#chat-panel { flex: 1; display: flex; flex-direction: column; background: #fff; }

#chat-header { padding: 16px 20px; border-bottom: 1px solid #eee; font-size: 18px; font-weight: 600; color: #333; }

#messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }

.msg { display: flex; gap: 10px; max-width: 80%; }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg.agent { align-self: flex-start; }

.avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.msg.user .avatar { background: #4f8ef7; color: #fff; }
.msg.agent .avatar { background: #f0e6ff; color: #7c3aed; }

.bubble-wrap { display: flex; flex-direction: column; gap: 6px; }

.thinking-box { background: #fafafa; border: 1px solid #e8e8e8; border-radius: 10px; padding: 10px 14px; font-size: 12px; color: #888; cursor: pointer; user-select: none; }
.thinking-box summary { font-weight: 500; color: #aaa; list-style: none; display: flex; align-items: center; gap: 6px; }
.thinking-box summary::before { content: "▶"; font-size: 10px; transition: transform .2s; }
details[open] .thinking-box summary::before { transform: rotate(90deg); }
.thinking-content { margin-top: 8px; white-space: pre-wrap; line-height: 1.6; }

.dim-section { margin-bottom: 6px; }
.dim-label { font-weight: 600; color: #7c3aed; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
.dim-row { display: flex; gap: 6px; flex-wrap: wrap; }
.dim-tag { background: #f3eeff; color: #6d28d9; border-radius: 6px; padding: 2px 8px; font-size: 11px; }

.bubble { padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
.msg.user .bubble { background: #4f8ef7; color: #fff; border-bottom-right-radius: 4px; }
.msg.agent .bubble { background: #f3f3f3; color: #222; border-bottom-left-radius: 4px; }

.cursor { display: inline-block; width: 2px; height: 14px; background: #555; animation: blink .7s infinite; vertical-align: middle; margin-left: 2px; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

#input-area { padding: 16px 20px; border-top: 1px solid #eee; display: flex; gap: 10px; }
#input-area textarea { flex: 1; resize: none; border: 1px solid #ddd; border-radius: 10px; padding: 10px 14px; font-size: 14px; outline: none; font-family: inherit; line-height: 1.5; max-height: 120px; }
#input-area textarea:focus { border-color: #4f8ef7; }
#send-btn { background: #4f8ef7; color: #fff; border: none; border-radius: 10px; padding: 0 20px; font-size: 14px; cursor: pointer; white-space: nowrap; }
#send-btn:disabled { background: #b0c8f7; cursor: not-allowed; }

/* ===== 右侧记忆栏 ===== */
#memory-panel { width: 300px; border-left: 1px solid #eee; background: #fafafa; display: flex; flex-direction: column; }
#memory-header { padding: 16px; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; }
#memory-header span { font-size: 15px; font-weight: 600; color: #333; }
#clear-btn { font-size: 12px; color: #f87171; background: none; border: 1px solid #fca5a5; border-radius: 6px; padding: 3px 8px; cursor: pointer; }
#memory-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.memory-card { background: #fff; border: 1px solid #e8e8e8; border-radius: 10px; padding: 12px; font-size: 13px; }
.memory-topic { font-weight: 600; color: #333; margin-bottom: 4px; }
.memory-content { color: #666; font-size: 12px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.memory-keywords { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
.memory-kw { background: #eef2ff; color: #4f46e5; border-radius: 4px; padding: 1px 6px; font-size: 11px; }
.memory-time { margin-top: 6px; color: #bbb; font-size: 11px; }
.empty-tip { color: #bbb; font-size: 13px; text-align: center; margin-top: 40px; }
</style>
</head>
<body>

<!-- 左侧聊天 -->
<div id="chat-panel">
  <div id="chat-header">💬 Empathetic companion agent</div>
  <div id="messages"></div>
  <div id="input-area">
    <textarea id="user-input" rows="1" placeholder="和小具说点什么…" onkeydown="handleKey(event)"></textarea>
    <button id="send-btn" onclick="sendMessage()">发送</button>
  </div>
</div>

<!-- 右侧记忆栏 -->
<div id="memory-panel">
  <div id="memory-header">
    <span>🧠 记忆库</span>
    <button id="clear-btn" onclick="clearMemories()">清空</button>
  </div>
  <div id="memory-list"><p class="empty-tip">暂无记忆</p></div>
</div>

<script>
const API = "";

// ===== 记忆 =====
async function loadMemories() {
  const res = await fetch(`${API}/api/memories`);
  const list = await res.json();
  const el = document.getElementById("memory-list");
  if (!list.length) { el.innerHTML = '<p class="empty-tip">暂无记忆</p>'; return; }
  el.innerHTML = list.slice().reverse().map(m => `
    <div class="memory-card">
      <div class="memory-topic">${esc(m.topic)}</div>
      <div class="memory-content">${esc(m.content)}</div>
      <div class="memory-keywords">${(m.keywords||[]).map(k=>`<span class="memory-kw">${esc(k)}</span>`).join("")}</div>
      <div class="memory-time">${m.create_time ? m.create_time.slice(0,16).replace("T"," ") : ""}</div>
    </div>`).join("");
}

async function clearMemories() {
  if (!confirm("确定清空所有记忆？")) return;
  await fetch(`${API}/api/memories`, { method: "DELETE" });
  loadMemories();
}

// ===== 聊天 =====
function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function appendUserMsg(text) {
  const el = document.getElementById("messages");
  el.insertAdjacentHTML("beforeend", `
    <div class="msg user">
      <div class="avatar">你</div>
      <div class="bubble-wrap"><div class="bubble">${esc(text)}</div></div>
    </div>`);
  el.scrollTop = el.scrollHeight;
}

function createAgentMsg() {
  const el = document.getElementById("messages");
  const id = "msg-" + Date.now();
  el.insertAdjacentHTML("beforeend", `
    <div class="msg agent" id="${id}">
      <div class="avatar">具</div>
      <div class="bubble-wrap">
        <details><summary class="thinking-box" style="list-style:none">
          <span style="font-size:12px;color:#aaa">▶ 思考中…</span>
        </summary>
        <div class="thinking-content" id="${id}-think"></div></details>
        <div class="bubble" id="${id}-bubble"><span class="cursor"></span></div>
      </div>
    </div>`);
  el.scrollTop = el.scrollHeight;
  return id;
}

function renderThinking(id, thinking) {
  const el = document.getElementById(`${id}-think`);
  if (!el) return;
  let html = "";
  const up = thinking.user_profile;
  if (up) {
    html += `<div class="dim-section"><div class="dim-label">用户画像</div>`;
    html += `<div class="dim-row">`;
    if (up.present?.emotion) html += `<span class="dim-tag">情绪: ${esc(up.present.emotion)}</span>`;
    if (up.present?.intent)  html += `<span class="dim-tag">意图: ${esc(up.present.intent)}</span>`;
    if (up.present?.context) html += `<span class="dim-tag">情境: ${esc(up.present.context)}</span>`;
    html += `</div>`;
    if (up.future?.prediction) html += `<div style="margin-top:4px;color:#d97706;font-size:11px">预测: ${esc(up.future.prediction)}</div>`;
    if (up.future?.risk)       html += `<div style="color:#ef4444;font-size:11px">风险: ${esc(up.future.risk)}</div>`;
    html += `</div>`;
  }
  const ap = thinking.agent_persona;
  if (ap) {
    html += `<div class="dim-section"><div class="dim-label">智能体人设</div>`;
    if (ap.present?.empathy)      html += `<div style="font-size:11px;color:#555">共情: ${esc(ap.present.empathy)}</div>`;
    if (ap.future?.action)        html += `<div style="font-size:11px;color:#7c3aed">引导: ${esc(ap.future.action)}</div>`;
    html += `</div>`;
  }
  el.innerHTML = html || "（无分析结果）";
  // 更新 summary 文字
  const summary = document.querySelector(`#${id} details summary span`);
  if (summary) summary.textContent = "思考过程";
}

async function sendMessage() {
  const input = document.getElementById("user-input");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  input.style.height = "auto";

  document.getElementById("send-btn").disabled = true;
  appendUserMsg(text);
  const msgId = createAgentMsg();
  const bubbleEl = document.getElementById(`${msgId}-bubble`);

  try {
    const res = await fetch(`${API}/api/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    let replyText = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split("\n\n");
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const evt = JSON.parse(line.slice(6));
        if (evt.type === "thinking") {
          renderThinking(msgId, evt.content);
        } else if (evt.type === "chunk") {
          replyText += evt.content;
          bubbleEl.textContent = replyText;
          document.getElementById("messages").scrollTop = 9999;
        } else if (evt.type === "done") {
          bubbleEl.textContent = replyText;
          loadMemories();
        }
      }
    }
  } catch (e) {
    bubbleEl.textContent = "请求失败，请检查后端是否启动~";
  }

  document.getElementById("send-btn").disabled = false;
  input.focus();
}

function handleKey(e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

// 自动调整输入框高度
document.getElementById("user-input").addEventListener("input", function() {
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 120) + "px";
});

loadMemories();
</script>
</body>
</html>
