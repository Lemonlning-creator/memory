[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-empathy-realtalk-v9"
version = "9.0.0"
description = "Frozen Ours V9 REALTALK persona simulation reproduction package"
requires-python = ">=3.11"
dependencies = ["openai==1.3.0", "httpx==0.27.2", "python-dotenv>=1.0.1,<2"]

[project.optional-dependencies]
test = ["pytest>=7.4,<9"]
realtalk-eval = ["bert-score==0.3.13", "torch>=2.5,<3", "transformers>=4.48,<5", "numpy>=1.26,<2"]

[tool.setuptools.packages.find]
include = ["src*", "release_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
