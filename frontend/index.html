<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户画像对话 Agent</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-shell">
        <div class="ambient ambient-left"></div>
        <div class="ambient ambient-right"></div>

        <main class="container">
            <aside class="profile-panel">
                <section class="profile-hero">
                    <div class="profile-hero-text">
                        <p class="eyebrow">User Profile</p>
                        <h1>用户画像</h1>
                        <p class="profile-hero-desc">沉淀用户信息与近期变化，让每次对话都更贴近用户本人。</p>
                    </div>
                </section>

                <section class="panel-block panel-block-profile">
                    <div class="panel-title-row">
                        <h2>画像卡片</h2>
                        <span class="panel-title-tip">实时刷新</span>
                    </div>
                    <div id="profileContent" class="profile-content">
                        <div class="loading">加载中...</div>
                    </div>
                </section>
            </aside>

            <section class="chat-panel">
                <section class="character-strip">
                    <div class="character-strip-title">
                        <p class="eyebrow">Character</p>
                        <h2>Select a companion</h2>
                    </div>
                    <div id="characterCards" class="character-cards">
                        <div class="loading">Loading characters...</div>
                    </div>
                </section>

                <header class="chat-header">
                    <div class="assistant-identity">
                        <div class="assistant-meta">
                            <p class="eyebrow">Conversation Agent</p>
                            <h2>个性化对话助手</h2>
                            <p class="assistant-subtitle">结合上下文与用户画像，给出更自然、个性化的回复。</p>
                        </div>
                    </div>

                    <div class="header-status-card">
                        <span class="status-indicator" id="statusIndicator"></span>
                        <div>
                            <p class="status-label">连接状态</p>
                            <p class="status-text" id="statusText">在线</p>
                        </div>
                    </div>
                </header>

                <div class="chat-stage">
                    <div id="chatHistory" class="chat-history">
                        <div class="message system">
                            <div class="message-content">你好！我是你的个性化助手。请尽情聊天吧！</div>
                        </div>
                    </div>
                </div>

                <footer class="chat-input-area">
                    <div class="input-panel">
                        <details id="experimentPanel" class="experiment-panel">
                            <summary class="experiment-toggle">
                                <span class="experiment-toggle-copy">
                                    <span class="ablation-label">消融实验</span>
                                    <span class="ablation-hint">展开后可复位到启动基线，再选择屏蔽维度</span>
                                </span>
                                <span class="experiment-toggle-icon" aria-hidden="true">+</span>
                            </summary>
                            <div class="ablation-toolbar">
                                <div class="ablation-copy">
                                    <span class="ablation-label">实验模式</span>
                                    <span id="ablationStatusText" class="ablation-hint">先点击实验复位，再选择一个维度开始测试</span>
                                </div>
                                <div class="ablation-controls">
                                    <button id="experimentResetBtn" type="button" class="btn btn-secondary">实验复位</button>
                                    <label class="ablation-option">
                                        <input type="radio" name="ablateDimension" value="state" disabled>
                                        <span>状态轴</span>
                                    </label>
                                    <label class="ablation-option">
                                        <input type="radio" name="ablateDimension" value="context" disabled>
                                        <span>语境轴</span>
                                    </label>
                                    <label class="ablation-option">
                                        <input type="radio" name="ablateDimension" value="memory" disabled>
                                        <span>时间轴</span>
                                    </label>
                                    <button id="clearAblationBtn" type="button" class="btn btn-secondary" disabled>清除选择</button>
                                </div>
                            </div>
                        </details>
                        <div class="input-wrapper">
                            <input
                                type="text"
                                id="userInput"
                                class="input-field"
                                placeholder="输入消息，按 Enter 发送"
                                autocomplete="off"
                            >
                            <button id="micBtn" class="btn btn-voice" type="button" title="语音输入">🎤</button>
                            <button id="sendBtn" class="btn btn-primary">发送</button>
                        </div>
                    </div>
                </footer>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
