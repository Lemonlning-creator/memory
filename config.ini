[API]
# api_key 与 base_url 已移至 .env 文件（API_KEY / BASE_URL）
# exp3 消融实验按 v18 基线配置：生成（抽取/画像/回复）用 qwen-plus
model = qwen-plus
embedding_model = text-embedding-v4
enable_thinking = False

[EvaluationAPI]
model = gpt-4o-mini
backend = zhizengzeng
base_url = https://api.zhizengzeng.com/v1
api_key_env = EVAL_API_KEY

[Server]
# Flask服务器配置
host = 0.0.0.0
port = 5000
debug = True

[Frontend]
# 前端配置
title = 用户画像对话Agent
api_url = http://localhost:5000
auto_refresh_interval = 5000

[Voice]
asr_model = paraformer-realtime-v2
tts_model = cosyvoice-v1
tts_voice = longxiaochun

[Milvus]
host = localhost
port = 19530
# 若使用 Milvus Cloud/Zilliz，填写 uri 和 token，否则留空
uri =
token =

[System]
# 系统配置
max_conversation_history = 20
# 当前未被代码读取；Prompt 语言由 src/prompts/prompt_loader.py 的 PROMPT_LANGUAGE 控制
language = zh-CN
